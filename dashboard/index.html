<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>idsterity — Pengadaan Pemerintah Indonesia 2026</title>
        <!-- ━━━ Open Graph ━━━ -->
        <meta property="og:type" content="website" />
        <meta property="og:locale" content="id_ID" />
        <meta property="og:url" content="https://yosef.id/sterity/" />
        <meta
            property="og:title"
            content="IDSTERITY - Pengadaan yang Mengada-ada"
        />
        <meta
            property="og:description"
            content="Rakyat Indonesia siap pesta seblak dengan penghematan."
        />
        <meta
            property="og:image"
            content="https://yosef.id/sterity/og-image.jpg"
        />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="627" />
        <meta property="og:image:type" content="image/jpeg" />
        <style>
            html, body {
                margin: 0;
                padding: 0;
                background: var(--bg-base);
                color: var(--ink-1);
                font-family: var(--serif);
                font-size: var(--size-body);
                line-height: var(--lh-body);
                font-feature-settings: 'liga', 'kern', 'onum';
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                overflow-x: hidden;
                scroll-behavior: smooth;
            }

            *, *::before, *::after { box-sizing: border-box; }

            h1, h2, h3, h4 {
                margin: 0;
                font-family: var(--serif);
                font-weight: 400;
                font-style: italic;
                color: var(--ink-1);
                text-wrap: balance;
            }

            p { margin: 0; text-wrap: pretty; }

            a {
                color: var(--link);
                text-decoration: underline;
                text-decoration-style: dotted;
                text-decoration-thickness: 1px;
                text-underline-offset: 3px;
                transition: color var(--t-fast) var(--ease);
            }
            a:hover {
                color: var(--link-hover);
                text-decoration-style: solid;
                text-decoration-color: var(--link-hover);
            }

            hr {
                border: 0;
                border-top: 1px solid var(--rule);
                margin: 0;
            }
        </style>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
